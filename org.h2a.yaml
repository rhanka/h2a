# Manifeste d'organisation h2a — les cinq rôles durables et l'owner.
#
# Forme machine de docs/governance/RACI.md. Lecture : `h2a org show` ; contrôle :
# `h2a org validate` ; écart avec le registre vivant : `h2a org diff`.
#
# STATUT : décidé par l'owner le 2026-09-19 (dossier « Rôles h2a », option A, D1=A) ;
# bascule coordonnée en attente des prérequis (D4=B), listés dans
# docs/governance/migration-cinq-roles.md. Rien ici n'accorde de droit.
#
# LA FRONTIÈRE DE RATIFICATION N'EXISTE PAS DANS LE CODE. Mesuré le 2026-07-29 par la
# troisième jambe de relecture de la PR 84 : `h2a org provision` accepte tout fichier qui
# passe `validateOrgManifest`, sans signature, sans enveloppe `org-ratified` et sans clé.
# Le cycle propose/ratify existe (`h2a coach propose` / `ratify`), mais le provisionnement
# ne vérifie pas qu'il a eu lieu. Seul le fait que personne n'a lancé la commande sépare ce
# fichier d'une attribution réelle de rôle : c'est une habitude, pas une frontière.
#
# MESURÉ AUSSI (2026-07-29, non re-mesuré depuis) : sur le registre partagé,
# `h2a org diff` et `h2a org provision` échouent avec `TypeError: r.roles is not
# iterable` sur une ligne héritée dont `role`/`scope` sont des scalaires.
#
# POURQUOI `instance:` PORTE UN NOM NU. Un identifiant d'instance h2a
# (`claude:h2a:c18853e319ea`) est émis par conversation : un manifeste qui nommerait les
# identifiants du jour serait périmé le lendemain. La poignée durable d'un rôle est son nom
# de lancement (`h2a run --name cond`), l'un des quatre espaces de noms que la résolution
# de cible doit parcourir (DOC-03). `h2a org diff` signale donc chaque rôle `missing` tant
# qu'aucune liaison nom → instance à clé n'existe : c'est la mesure de l'écart entre ce
# papier et la machine, pas un défaut du manifeste.
#
# CORRESPONDANCE AVEC LES DOUZE ACTEURS PRÉCÉDENTS : voir RACI.md, « Correspondance avec
# les acteurs précédents ». harness, track et cyber rejoignent arch ; coop, memory, agents
# et gateway rejoignent runtime ; plugins rejoint infra.

scope: org:h2a
version: "1"

instances:
  # ---- l'owner humain ----------------------------------------------------------
  - instance: fabien
    role: PRINCIPAL
    scopes: [org:h2a]
    mandateRights: [ratify-org, accept-uat, set-priority]

  # ---- Conduite · h-cond · WP4 --------------------------------------------------
  # Délégation systématique (D2=A) : le conducteur délègue construction et
  # intégration ; il pilote et débloque.
  - instance: cond
    role: CONDUCTOR
    scopes: [org:h2a, org:h2a/wp4]
    mandateRights: [define-raci, dispatch, wake]

  # ---- Cadre et assurance · h-arch · WP8, WP9 + périmètre sécurité -------------
  # Réunit architecture, méthode (ex-harness), Track (ex-track) et contrôle de
  # sécurité (ex-cyber). Type conservé à AGENTS : l'architecte avait refusé CONTROL le
  # 2026-07-29, CONTROL pouvant *imposer* une POLICY au conducteur, et le dossier
  # exclut toute extension de droits implicite. Le choix AGENTS vs CONTROL après
  # absorption de harness et cyber est soumis à l'avis de h-arch (prérequis n° 1).
  # Les droits d'audit restent dans le scope sécurité : WP7 n'est pas doublé pour
  # exprimer une consultation. arch ne relit ni ne vérifie ses propres productions
  # (RACI.md, « Contrôles indépendants du rôle Cadre et assurance »).
  - instance: arch
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp8, org:h2a/wp9, org:h2a/security]
    mandateRights: [advise-raci, arbitrate-boundaries, gate-tests, gate-branch, gate-audit]

  # ---- Moteur · h-runtime · WP1, WP2, WP3, WP5, WP11, WP13, WP14 ----------------
  # Y compris MCP au démarrage, --gw/--bare, RTK et JEV natifs.
  - instance: runtime
    role: AGENTS
    scopes:
      - org:h2a
      - org:h2a/wp1
      - org:h2a/wp2
      - org:h2a/wp3
      - org:h2a/wp5
      - org:h2a/wp11
      - org:h2a/wp13
      - org:h2a/wp14

  # ---- Expérience · h-portal · WP12 ----------------------------------------------
  # Focus, diagrammes, interfaces présentées à l'owner.
  - instance: portal
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp12]

  # ---- Plateforme · h-infra · WP6, WP7, WP10 ------------------------------------
  # Services, identités, plugins et versions. La portée de l'audit de sécurité de ce
  # qu'infra déploie est fixée par cond ou l'owner, jamais par infra.
  - instance: infra
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp6, org:h2a/wp7, org:h2a/wp10]

# Indications seulement — la vraie porte de messagerie est l'appartenance aux scopes, et
# chaque rôle est dans `org:h2a`. Ces arêtes disent quels échanges doivent porter, pas
# lesquels sont permis.
commEdges:
  # délégation : le conducteur s'adresse à chaque rôle
  - from: cond
    to: arch
  - from: cond
    to: runtime
  - from: cond
    to: portal
  - from: cond
    to: infra
  # le contrepoids obligatoire : l'avis de l'architecte sur le RACI
  - from: arch
    to: cond
  # escalade vers l'owner ; alertes de sécurité et avis architectural gardent un accès direct
  - from: cond
    to: fabien
  - from: arch
    to: fabien
