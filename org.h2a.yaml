# h2a org manifest — the twelve durable actors and the owner.
#
# Machine form of docs/governance/RACI.md. Read it with `h2a org show`, check it
# with `h2a org validate`, measure the drift against the live registry with
# `h2a org diff`.
#
# STATUS: PROPOSED. Nothing here grants anything yet.
#
# THE RATIFICATION BOUNDARY NOW EXISTS. An earlier version of this header said
# the opposite, and it was measured false by the third review leg on PR 84.
# That measurement drove H2A-ORG-H1: `h2a org provision` fails closed on a
# verified `org-ratified` envelope signed by the owning PRINCIPAL over exactly
# this committed file, and the round-2 hardening closed the gaps the reviews
# found in that gate. The ratifier must be a declared PRINCIPAL carrying the
# `ratify-org` mandate right (fabien below), the signature must verify against
# an ACTIVE keyring key — registration-baked plus rotated-in, minus
# rotated-out, and an offboard tombstone empties the set — and an edited or
# unsigned copy of this file creates no rights. Unratified here means
# unprovisioned, by code, not by habit.
#
# The TypeError the same leg measured on the real shared registry (`r.roles is
# not iterable` on legacy scalar rows) is also fixed: the effective-registry
# view now normalizes legacy rows defensively instead of crashing diff and
# provision.
#
# WHY `instance:` CARRIES A BARE NAME. The org model keys an actor on an
# `instance` id, but an h2a instance id (`claude:h2a:c18853e319ea`) is minted per
# conversation: a manifest naming today's ids is stale tomorrow — and a
# per-conversation id in a manifest is now a validation error. The durable
# handle of an actor is its launch name (`h2a run --name cond`), which is one of
# the four namespaces target resolution is decided to search (DOC-03). So the
# manifest binds the durable name, and `h2a org diff` reports every actor as
# `missing` until a name→keyed-instance binding exists. That output is the
# measure of the gap between this paper and the machine — not a defect of the
# manifest.

scope: org:h2a
version: "1"

instances:
  # ---- the human owner -------------------------------------------------------
  - instance: fabien
    role: PRINCIPAL
    scopes: [org:h2a]
    mandateRights: [ratify-org, accept-uat, set-priority]

  # ---- transverse actors -----------------------------------------------------
  - instance: cond
    role: CONDUCTOR
    scopes: [org:h2a, org:h2a/wp4]
    mandateRights: [define-raci, dispatch, wake]
  # `arch` is the counterweight to the conductor owning WP4, and the org role
  # vocabulary has no advisor role. CONTROL was not taken: in the authority
  # matrix CONTROL may *impose* POLICY, which is more than the owner granted.
  # AGENTS + an advisory mandate right is the honest encoding; see the open
  # question in docs/governance/RACI.md.
  - instance: arch
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp6]
    mandateRights: [advise-raci, arbitrate-boundaries]
  - instance: harness
    role: CONTROL
    scopes: [org:h2a, org:h2a/wp9]
    mandateRights: [gate-tests, gate-branch]
  # `cyber` is the only actor without a WP, and it delivers rather than advises.
  # Its scope is a policy domain, not a WP; whether it gets a WP of its own is
  # an open owner decision.
  - instance: cyber
    role: CONTROL
    scopes: [org:h2a, org:h2a/security]
    mandateRights: [gate-audit, ship-security-fix]

  # ---- domain lanes ----------------------------------------------------------
  - instance: coop
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp1, org:h2a/wp2, org:h2a/wp3]
  - instance: runtime
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp5]
  - instance: track
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp8]
  - instance: plugins
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp10]
  - instance: memory
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp11]
  - instance: portal
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp12]
  - instance: agents
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp13]
  - instance: gateway
    role: AGENTS
    scopes: [org:h2a, org:h2a/wp14]

# Informational hints only — the actual messaging gate is scope membership, and
# every actor sits in `org:h2a`. These edges say which exchanges are expected to
# carry weight, not which are permitted.
commEdges:
  # dispatch: the conductor addresses every actor
  - from: cond
    to: arch
  - from: cond
    to: harness
  - from: cond
    to: cyber
  - from: cond
    to: coop
  - from: cond
    to: runtime
  - from: cond
    to: track
  - from: cond
    to: plugins
  - from: cond
    to: memory
  - from: cond
    to: portal
  - from: cond
    to: agents
  - from: cond
    to: gateway
  # the mandatory counterweight: the architect's advice on the RACI
  - from: arch
    to: cond
  # escalation to the owner
  - from: cond
    to: fabien
  - from: arch
    to: fabien
  - from: cyber
    to: fabien
