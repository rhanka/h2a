# EVO-13 P1 — instance-mirror ingester. SEPARATE deployment from the read-only
# MCP pod: it WRITES the shared store (registerInstance) while the MCP surface
# only reads it. Co-mounts the shared RWX PVC (matchid-rwx). Authority is the
# operator-enrolled signing key (H2A_MIRROR_ENROLLED_KEYS, base64 JSON of PEMs);
# an unknown key is refused (no TOFU on the wire).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: h2a-mirror-ingester
  labels:
    app.kubernetes.io/name: h2a-mirror-ingester
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: h2a-mirror-ingester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: h2a-mirror-ingester
    spec:
      serviceAccountName: h2a-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ingester
          image: rg.fr-par.scw.cloud/h2a-mcp/h2a-cli:latest
          imagePullPolicy: IfNotPresent
          command:
            - h2a
            - remote
            - mirror-serve
            - --root
            - /var/lib/h2a/root
            - --host
            - 0.0.0.0
            - --port
            - "8788"
          env:
            - name: H2A_LOCK_MODE
              value: lease
          envFrom:
            - secretRef:
                name: h2a-mirror-secret
                optional: true
          ports:
            - name: http
              containerPort: 8788
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/h2a
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: h2a-mcp-shared
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: h2a-mirror-ingester
  labels:
    app.kubernetes.io/name: h2a-mirror-ingester
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: h2a-mirror-ingester
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The tenant default-deny-ingress (poc-k8s contract) blocks the ingester pod;
# allow Traefik (and kube-system) to reach it on 8788, mirroring h2a-mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-ingester
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: h2a-mirror-ingester
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8788
