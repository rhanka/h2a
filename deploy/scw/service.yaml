apiVersion: v1
kind: Service
metadata:
  name: h2a-mcp
  labels:
    app.kubernetes.io/name: h2a-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: h2a-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
    # EVO-13: the mirror-ingester sidecar (agents POST signed registrations).
    - name: mirror
      port: 8788
      targetPort: mirror
