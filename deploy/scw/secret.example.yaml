apiVersion: v1
kind: Secret
metadata:
  name: h2a-mcp-secret
  namespace: h2a-mcp
type: Opaque
stringData:
  # Optional: only required when H2A_HOSTED_ENROLLMENT_ENABLED=true.
  # Operator-chosen shared secret that gates the /authorize consent step
  # (single-tenant self-AS). Rotate by re-applying + `kubectl rollout restart`.
  OAUTH_CONSENT_SECRET: not-a-real-consent-secret
---
# EVO-13: keys the mirror ingester trusts (separate secret = h2a-mirror-secret,
# consumed by the h2a-mirror-ingester Deployment). base64 of a JSON array of the
# operator-enrolled agent public-key PEMs. Build it out-of-band, e.g.:
#   node -e 'console.log(Buffer.from(JSON.stringify([fs.readFileSync("agent.pub","utf8")])).toString("base64"))'
apiVersion: v1
kind: Secret
metadata:
  name: h2a-mirror-secret
  namespace: h2a-mcp
type: Opaque
stringData:
  H2A_MIRROR_ENROLLED_KEYS: "W10="  # base64("[]") — no key enrolled by default
