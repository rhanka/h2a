apiVersion: v1
kind: Secret
metadata:
  name: h2a-mcp-secret
  namespace: h2a-mcp
type: Opaque
stringData:
  # Operator-chosen shared secret that gates the /authorize consent step
  # (single-tenant self-AS). Rotate by re-applying + `kubectl rollout restart`.
  OAUTH_CONSENT_SECRET: not-a-real-consent-secret
