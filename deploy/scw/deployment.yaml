apiVersion: apps/v1
kind: Deployment
metadata:
  name: h2a-mcp
  labels:
    app.kubernetes.io/name: h2a-mcp
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the single replica owns a ReadWriteOnce PVC, so
  # a surge pod on another node hits a Multi-Attach error and the rollout
  # deadlocks. Recreate stops the old pod first, freeing the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: h2a-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: h2a-mcp
    spec:
      serviceAccountName: h2a-mcp
      # Image lives in the Scaleway Container Registry namespace `h2a-mcp`, which
      # is public (is_public=true, same convention as the mcp-wave tenant) — no
      # imagePullSecret needed. Built + pushed by deploy/scw/deploy.sh.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: h2a-mcp
          image: rg.fr-par.scw.cloud/h2a-mcp/h2a-cli:latest
          imagePullPolicy: IfNotPresent
          # The image ENTRYPOINT is the `h2a` CLI; override it to launch the
          # EVO-12 hosted MCP HTTP server (self-AS OAuth, read-only surface).
          command:
            - node
            - /opt/h2a/packages/h2a-cli/dist/runtime/mcp-http/main.js
          ports:
            - name: http
              containerPort: 8787
          env:
            # Same RWO volume shared with the mirror-ingester sidecar (same pod →
            # same node → RWO co-mount is safe) → lease locking (DEC-065/067).
            - name: H2A_LOCK_MODE
              value: lease
          envFrom:
            - configMapRef:
                name: h2a-mcp-config
            - secretRef:
                name: h2a-mcp-secret
                optional: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/h2a
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        # EVO-13 P1 — instance-mirror ingester as a SIDECAR (the matchid-rwx node
        # pool is currently at max-volume-count, so a separate RWX pod can't bind;
        # co-locating in the MCP pod shares the RWO volume on one node). It WRITES
        # registry/presence; the MCP container only reads. Authority = the
        # operator-enrolled signing key (H2A_MIRROR_ENROLLED_KEYS).
        - name: mirror-ingester
          image: rg.fr-par.scw.cloud/h2a-mcp/h2a-cli:latest
          imagePullPolicy: IfNotPresent
          command:
            - h2a
            - remote
            - mirror-serve
            - --root
            - /var/lib/h2a/root
            - --host
            - 0.0.0.0
            - --port
            - "8788"
          ports:
            - name: mirror
              containerPort: 8788
          env:
            - name: H2A_LOCK_MODE
              value: lease
          envFrom:
            - secretRef:
                name: h2a-mirror-secret
                optional: true
          readinessProbe:
            tcpSocket:
              port: mirror
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/h2a
            - name: tmp
              mountPath: /tmp
      volumes:
        # Persists the self-AS OAuth client/token store AND the h2a root
        # (H2A_ROOT) across restarts. DEC-116 invariant: no ed25519 private key
        # is ever written here — the hosted surface is read-only.
        - name: data
          persistentVolumeClaim:
            claimName: h2a-mcp-data
        - name: tmp
          emptyDir: {}
