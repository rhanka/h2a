apiVersion: v1
kind: ConfigMap
metadata:
  name: h2a-mcp-config
  namespace: h2a-mcp
data:
  NODE_ENV: production
  PORT: "8787"
  # Public HTTPS origin claude.ai connects to. Must match the Ingress host and
  # the issuer below (no trailing slash — RFC 8414).
  PUBLIC_BASE_URL: https://h2a-mcp.sent-tech.ca
  OAUTH_ISSUER_URL: https://h2a-mcp.sent-tech.ca
  # claude.ai / claude.com OAuth callback URLs (DCR redirect allowlist).
  OAUTH_ALLOWED_REDIRECT_URIS: https://claude.ai/api/mcp/auth_callback,https://claude.com/api/mcp/auth_callback
  OAUTH_ACCESS_TOKEN_TTL_SECONDS: "3600"
  OAUTH_REFRESH_TOKEN_TTL_SECONDS: "1209600"
  OAUTH_AUTH_CODE_TTL_SECONDS: "60"
  # Remote connector enrollment is disabled by default until the hosted service
  # has an explicit multi-tenant policy. Set to "true" only for a controlled
  # operator-gated enrollment window.
  H2A_HOSTED_ENROLLMENT_ENABLED: "false"
  # Both the self-AS client/token store and the h2a root live on the PVC
  # (readOnlyRootFilesystem: true → only mounted volumes are writable).
  OAUTH_STORE_PATH: /var/lib/h2a/oauth-clients.json
  H2A_ROOT: /var/lib/h2a/root
  # ── EVO-12 P2 (mode 3): multi-tenant gateway broker ──────────────────────
  # When "true", /authorize delegates the USER login to 39-auth (OIDC) instead
  # of the consent secret, and /mcp serves each user their own per-tenant root
  # under H2A_ROOT/tenants/<sub>. The client secret goes in the Secret below.
  # Leave "false" (the default) for single-tenant; flip to "true" + supply the
  # H2A_UPSTREAM_* values once the 39-auth client `h2a-gateway` is seeded.
  H2A_BROKER_MODE: "false"
  H2A_UPSTREAM_ISSUER: https://sentropic.sent-tech.ca
  H2A_UPSTREAM_AUTHORIZE_URL: https://sentropic.sent-tech.ca/api/v1/auth/oauth/authorize
  H2A_UPSTREAM_TOKEN_URL: https://sentropic.sent-tech.ca/api/v1/auth/oauth/token
  H2A_UPSTREAM_CLIENT_ID: h2a-gateway
  # Must be registered at 39-auth for the seeded client (this gateway's callback):
  H2A_UPSTREAM_REDIRECT_URI: https://h2a-mcp.sent-tech.ca/oidc/callback
  H2A_UPSTREAM_SCOPES: openid
