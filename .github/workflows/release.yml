name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22.22.2 hosted-toolcache npm is currently missing a transitive
          # npm install dependency; use Node 20 only for the publish bootstrap.
          node-version: "20"

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Version sanity gate (tag vs package.json)
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Strip leading "v"
          tag_version="${tag#v}"
          if [[ ! "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$tag' does not match vX.Y.Z (got version='$tag_version')." >&2
            exit 1
          fi
          h2a_version="$(node -p "require('./packages/h2a/package.json').version")"
          cli_version="$(node -p "require('./packages/h2a-cli/package.json').version")"
          runtime_version="$(node -p "require('./packages/h2a-runtime/package.json').version")"
          echo "Tag version           : $tag_version"
          echo "@sentropic/h2a        : $h2a_version"
          echo "@sentropic/h2a-cli    : $cli_version"
          echo "@sentropic/h2a-runtime: $runtime_version"
          if [[ "$h2a_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a/package.json version ($h2a_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$cli_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a-cli/package.json version ($cli_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$runtime_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a-runtime/package.json version ($runtime_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish @sentropic/h2a (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a --access public

      - name: Publish @sentropic/h2a-cli (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a-cli --access public

      - name: Publish @sentropic/h2a-runtime (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a-runtime --access public

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
