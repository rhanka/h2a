name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Version sanity gate (tag vs package.json)
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Strip leading "v"
          tag_version="${tag#v}"
          if [[ ! "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$tag' does not match vX.Y.Z (got version='$tag_version')." >&2
            exit 1
          fi
          h2a_version="$(node -p "require('./packages/h2a/package.json').version")"
          cli_version="$(node -p "require('./packages/h2a-cli/package.json').version")"
          echo "Tag version       : $tag_version"
          echo "@sentropic/h2a    : $h2a_version"
          echo "@sentropic/h2a-cli: $cli_version"
          if [[ "$h2a_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a/package.json version ($h2a_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$cli_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a-cli/package.json version ($cli_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Detect NPM_TOKEN
        id: npm_token
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish. Provenance + release-notes steps will be skipped too. This lets contributor PRs preview the workflow without the secret."
          fi

      - name: Publish @sentropic/h2a (provenance, public)
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @sentropic/h2a --provenance --access public

      - name: Publish @sentropic/h2a-cli (provenance, public)
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace @sentropic/h2a-cli --provenance --access public

      - name: Create GitHub Release (idempotent)
        if: steps.npm_token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
