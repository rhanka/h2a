name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Owner decision 2026-07-27 (track 01KYJ3Q3V5AW9YR0QMXSGW93RE): cross-platform
        # Windows/macOS support is a SEPARATE workstream and must not gate a release.
        # Known failures parked there — reporting-stdin on Windows (spawnSync stdin),
        # restore-dead-session-recovery on Windows, and a truncated `--help` capture on
        # the macOS/Node-20 runner — are pre-existing on main and unrelated to any release.
        # What this gate no longer proves: that the released code works on macOS or Windows.
        # `smoke-install` on push-to-main still exercises the PUBLISHED package on all three.
        os: [ubuntu-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Refusing release: ${GITHUB_REF} points to ${GITHUB_SHA}, which is not on origin/main."
            echo "::error::Create the tag only after the version commit is merged into main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run audit:security
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22.22.2 hosted-toolcache npm is currently missing a transitive
          # npm install dependency; use Node 20 only for the publish bootstrap.
          node-version: "20"

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Version sanity gate (tag vs package.json)
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # Strip leading "v"
          tag_version="${tag#v}"
          if [[ ! "$tag_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$tag' does not match vX.Y.Z (got version='$tag_version')." >&2
            exit 1
          fi
          h2a_version="$(node -p "require('./packages/h2a/package.json').version")"
          cli_version="$(node -p "require('./packages/h2a-cli/package.json').version")"
          runtime_version="$(node -p "require('./packages/h2a-runtime/package.json').version")"
          track_version="$(node -p "require('./packages/track/package.json').version")"
          echo "Tag version           : $tag_version"
          echo "@sentropic/h2a        : $h2a_version"
          echo "@sentropic/h2a-cli    : $cli_version"
          echo "@sentropic/h2a-runtime: $runtime_version"
          echo "@sentropic/track      : $track_version"
          if [[ "$h2a_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a/package.json version ($h2a_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$cli_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a-cli/package.json version ($cli_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$runtime_version" != "$tag_version" ]]; then
            echo "::error::packages/h2a-runtime/package.json version ($runtime_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          if [[ "$track_version" != "$tag_version" ]]; then
            echo "::error::packages/track/package.json version ($track_version) does not match tag ($tag_version). Run 'npm run release -- --version $tag_version' before tagging." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$tag_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      # Published first: @sentropic/track is a runtime dependency of
      # @sentropic/h2a, so its lockstep version must exist on the registry
      # before h2a@X.Y.Z (which now pins @sentropic/track@^X.Y.Z) is installed.
      #
      # ⚠️ OIDC WALL: npm Trusted Publishing for @sentropic/track is still
      # configured against the OLD repo (rhanka/track), NOT rhanka/h2a. Until
      # the trusted publisher is re-pointed at rhanka/h2a + release.yml (a
      # creds gesture on npmjs.com — see docs/release.md), this step will fail
      # with an OIDC-mismatch error. Fallback: set NODE_AUTH_TOKEN from an npm
      # automation token with publish rights and drop the trusted-publishing
      # reliance for this package only.
      # @sentropic/track is currently published out-of-band with an npm automation
      # token (OIDC Trusted Publishing for this package is still pinned to the old
      # rhanka/track repo and re-pointing it requires a 2FA gesture on npmjs.com).
      # Idempotent: if the lockstep version is already on the registry (token
      # publish), skip; otherwise publish via OIDC (works once trust is re-pointed).
      - name: Publish @sentropic/track (public; token-published out-of-band for now)
        run: |
          v="$(node -p "require('./packages/track/package.json').version")"
          if npm view "@sentropic/track@$v" version >/dev/null 2>&1; then
            echo "@sentropic/track@$v already on registry; skipping."
          else
            npm publish --workspace @sentropic/track --access public
          fi

      - name: Publish @sentropic/h2a (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a --access public

      - name: Publish @sentropic/h2a-cli (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a-cli --access public

      - name: Publish @sentropic/h2a-runtime (trusted publishing, public)
        run: npm publish --workspace @sentropic/h2a-runtime --access public

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping creation."
            exit 0
          fi
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag

      # This is deliberately after GitHub Release creation: publication is already
      # irreversible, so a broken artefact must be reported without hiding the
      # release that describes what npm now serves. It initializes an isolated
      # bus and runs doctor in host-repair dry-run mode on Ubuntu.
      - name: Verify published @sentropic/h2a doctor (post-release)
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=6
          retry_delay_seconds=10
          for attempt in $(seq 1 "$max_attempts"); do
            if npm i -g "@sentropic/h2a@$RELEASE_VERSION"; then
              break
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::@sentropic/h2a@$RELEASE_VERSION was not installable after $max_attempts attempts." >&2
              exit 1
            fi
            echo "@sentropic/h2a@$RELEASE_VERSION is not available yet; retrying in $retry_delay_seconds seconds (attempt $attempt/$max_attempts)." >&2
            sleep "$retry_delay_seconds"
          done
          root="$(mktemp -d)/.h2a"
          # Initialize the bus so doctor can inspect host installations instead of
          # failing only on a missing root/schema. --repair --dry-run reports host
          # findings and planned actions without mutating the runner.
          h2a init --root "$root" >/dev/null
          # Capture stdout even when doctor reports host-health findings; the node
          # check below decides from report content.
          out="$(h2a doctor --root "$root" --repair --dry-run --format json 2>/dev/null || true)"
          node -e '
            const hasOwn = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
            let report;
            try {
              report = JSON.parse(process.argv[1]);
            } catch {
              process.exit(1);
            }
            if (
              report === null ||
              typeof report !== "object" ||
              !hasOwn(report, "ok") ||
              typeof report.ok !== "boolean"
            ) {
              process.exit(1);
            }
            if (report.ok === true) process.exit(0);

            let unrepaired;
            if (hasOwn(report, "unrepaired")) {
              unrepaired = report.unrepaired;
            } else if (
              Array.isArray(report.hosts) &&
              report.hosts.length > 0 &&
              report.hosts.every(
                (host) => host !== null && typeof host === "object" && Array.isArray(host.unrepaired)
              )
            ) {
              unrepaired = report.hosts.flatMap((host) => host.unrepaired);
            }
            if (
              !Array.isArray(unrepaired) ||
              unrepaired.length === 0 ||
              unrepaired.some(
                (entry) =>
                  entry === null ||
                  typeof entry !== "object" ||
                  !hasOwn(entry, "code") ||
                  entry.code !== "host-cli-unreachable"
              )
            ) {
              process.exit(1);
            }
          ' "$out"
