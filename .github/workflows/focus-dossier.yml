name: Focus portable dossier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Round-1 (code-review astra-8/sol-9): install AND qualify the L0
      # filesystem barrier in the runner — no unconfined fallback.
      # Round-3 (reviews pr382-r3): Ubuntu 24.04+ runners restrict unprivileged user
      # namespaces via AppArmor ("bwrap: setting up uid map: Permission denied").
      # Lifting the knob where it exists is provisioning, not a fallback.
      - name: Provision the L0 test barrier (bubblewrap)
        run: command -v bwrap >/dev/null || { sudo apt-get update && sudo apt-get install -y bubblewrap uidmap; } && bwrap --version && if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Prepare the exact frozen evidence corpus Git objects
        run: node packages/h2a/focus-kit/test/prepare-evidence-corpus.mjs
      - name: Verify corpus preparation from a depth-one checkout
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/focus-kit/test/evidence-corpus-checkout.test.mjs
      - run: node scripts/build-focus-dossier.mjs --check
      - name: Validate and build portable dossier fixtures
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/test/focus-build.test.js
      - name: Fresh H1 package template and build without checkout imports
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/test/distribution-increments.test.js
      - run: npm --prefix packages/h2a/focus-kit ci --no-audit --no-fund
      - run: npm --prefix packages/h2a/focus-kit exec -- playwright install --with-deps chromium
      - name: Offline desktop and phone, themes, selection and touch pinch
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/focus-kit/test/browser.test.mjs
      - name: H1 evidence tasks and fresh installed-package opening
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/focus-kit/test/evidence-browser.test.mjs
      - name: Strict memory observation including exiting owned processes
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/focus-kit/test/evidence-memory.test.mjs
      - name: Frozen H1 evidence reactivity and memory policy
        env:
          # The L0 barrier deletes the run root after the step, so the
          # launcher publishes <tmp>/**/metrics.json to this exchange dir
          # before cleanup (see scripts/test-sandbox.mjs); the upload glob
          # below collects <exchange>/focus-evidence-performance-*/metrics.json.
          FOCUS_METRICS_OUT: ${{ runner.temp }}
        run: node scripts/test-sandbox.mjs -- node --import ./packages/h2a/test/helpers/native-isolation.js --test packages/h2a/focus-kit/test/evidence-performance-browser.test.mjs
      - name: Retain raw H1 performance samples and artifact hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-evidence-metrics-${{ github.sha }}
          path: ${{ runner.temp }}/focus-evidence-performance-*/metrics.json
          if-no-files-found: error
