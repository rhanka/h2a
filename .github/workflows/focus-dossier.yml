name: Focus portable dossier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-focus-dossier.mjs --check
      - name: Validate and build portable dossier fixtures
        run: node --test packages/h2a/test/focus-build.test.js
      - run: npm --prefix packages/h2a/focus-kit ci --no-audit --no-fund
      - run: npm --prefix packages/h2a/focus-kit exec -- playwright install --with-deps chromium
      - name: Offline desktop and phone, themes, selection and touch pinch
        run: node --test packages/h2a/focus-kit/test/browser.test.mjs
