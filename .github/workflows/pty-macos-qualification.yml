name: pty-macos-qualification

# Lot BM owns this workflow (SPEC_EVOL_PTY_B_BATCH_HANDOVER §5/D27): it runs
# the darwin file sets on macOS ARM64 with skipped: 0 enforcement. A dedicated
# workflow — not a matrix cell in ci.yml — because ci.yml's build-and-test runs
# the full Linux-coupled suite, and unparking macOS there would turn unrelated
# suites red-and-tolerated instead of inactive (owner decision 2026-07-28).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  darwin-substrate:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Owner decision 2026-10-12: minimum Node 22; qualify 22 and 24.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The darwin tests spawn the built owner/frontend processes from dist.
      - run: npm run build
      - name: Run the darwin substrate file set
        run: |
          set -euo pipefail
          npx --no-install vitest run \
            packages/h2a-runtime/src/native-terminal/darwin-publication.test.ts \
            packages/h2a-runtime/src/native-terminal/darwin-identity.test.ts 2>&1 | tee /tmp/darwin-pty.log
      - name: Enforce skipped 0 in the darwin set
        run: |
          set -euo pipefail
          if grep -E "[1-9][0-9]* skipped" /tmp/darwin-pty.log; then
            echo "darwin set must have skipped: 0"
            exit 1
          fi
