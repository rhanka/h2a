name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-debt:
    # The owner parked cross-platform CI coverage separately (01KYJ3Q3V5AW9YR0QMXSGW93RE).
    # This dependency-tree audit gate is deliberately Linux-only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:security

  zero-python:
    # Owner standing rule: 0 Python in repos and jobs (supply-chain: a Python
    # job means a new unvalidated container image). This gate fails on any
    # tracked *.py file or python/pip invocation outside the explicit
    # owner-approved allowlist (scripts/no-python-allowlist.txt — currently
    # only the Dockerfile node-pty toolchain line, pending owner decision).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/check-no-python.sh
      - name: Guard self-tests (positive and negative fixtures)
        run: node --test scripts/check-no-python.test.mjs
      - name: Replacement-script tests (smoke-live-bus, git-dogfood guard)
        run: |
          bash scripts/test-smoke-live-bus.sh
          # Absolute hook path: the test cd's into a temp dir before exec'ing it.
          bash packages/track/.claude/hooks/test-git-dogfood-guard.sh "$GITHUB_WORKSPACE/packages/track/.claude/hooks/pre-bash-git-dogfood-guard.sh"

  host-oracle:
    # The two independent review legs of PR #94 converged on this: configuration tests
    # cannot prove what the HOST serves. Both of that PR's real defects — codex still
    # serving the pre-repair MCP server, and a dead marketplace root killing the whole
    # plugin subsystem — passed a green suite and two GO verdicts. The only thing that
    # caught them was asking codex itself.
    #
    # WHERE THIS GUARANTEE STOPS, stated because a guard whose limits are unstated
    # manufactures assurance: this job exercises CODEX only, on throwaway roots, on
    # Linux. It does not exercise Claude, it does not exercise any real installation,
    # and it is not a substitute for the owner's UAT.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pin the host oracle to the known-good CLI installed on this host (0.145.0).
      # The unpinned install failed once in 52 runs on release/v0.90.2: run 30728408587
      # (2026-08-02) served the old MCP server after repair and made a release cut red.
      - name: Install the codex CLI — it is the oracle, not a convenience
        run: npm i -g @openai/codex@0.145.0
      - name: Codex rejects an invalid preserved configuration
        run: |
          set -euo pipefail
          unset CODEX_HOME CLAUDE_CONFIG_DIR
          node --test --test-name-pattern='Codex oracle rejects an invalid array MCP table and accepts the framed table' packages/h2a/test/host-installation-doctor.test.js
      - name: Ask the host what it serves
        run: |
          set -euo pipefail
          unset CODEX_HOME CLAUDE_CONFIG_DIR
          # This is a candidate-installation test. Before a release tag exists,
          # the public `main` marketplace necessarily still exposes the prior
          # version, so mirror this exact checkout behind the canonical Git URL.
          # The probe keeps exercising Codex's native marketplace/cache/config
          # path; only the fixture source is made release-atomic.
          oracle_marketplace=$(mktemp -d "$RUNNER_TEMP/h2a-oracle-marketplace.XXXXXX")
          oracle_git_config=$(mktemp "$RUNNER_TEMP/h2a-oracle-gitconfig.XXXXXX")
          git init --bare "$oracle_marketplace" >/dev/null
          git -C "$oracle_marketplace" config receive.shallowUpdate true
          git -C "$GITHUB_WORKSPACE" push "$oracle_marketplace" HEAD:refs/heads/main >/dev/null
          git config --file "$oracle_git_config" url."file://$oracle_marketplace".insteadOf https://github.com/rhanka/h2a.git
          GIT_CONFIG_GLOBAL="$oracle_git_config" bash docs/uat/probe-oracle.sh

      # "An error is not an absence" has been closed once and came back twice through
      # different doors — the marketplace probe, then the artifact-based presence rule.
      # Closing it a third time guarantees nothing, so the two review legs' manual
      # attacks are pinned here as a matrix, positive control included. It runs no
      # native CLI: it lays down host-CLI presence itself rather than inheriting it.
      - name: An error is not an absence
        run: |
          set -euo pipefail
          unset CODEX_HOME CLAUDE_CONFIG_DIR
          bash docs/uat/probe-presence.sh

  # Same source and full M17 case, on its own runner. An artifact is published
  # only after reconciliation, owned-process exit and real volume cleanup.
  m17-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      H2A_TEST_CI_M17_OUTPUT: ${{ github.workspace }}/tmp/m17-export
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare the private M17 data volume
        run: node scripts/ci-m17-temp.mjs setup
      - name: Execute the complete M17 backend qualification
        run: node scripts/ci-m17-proof.mjs run
      - name: Remove the private M17 data volume
        if: ${{ always() && env.H2A_TEST_M17_TMPDIR != '' }}
        run: node scripts/ci-m17-temp.mjs cleanup
      - name: Seal the same-run proof after cleanup
        run: node scripts/ci-m17-proof.mjs finalize
      - uses: actions/upload-artifact@v4
        with:
          name: m17-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
          path: tmp/m17-export/proof.json
          if-no-files-found: error
          retention-days: 7

  bulk-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Execute every bulk packaging and corpus case
        run: node scripts/ci-bulk-proof.mjs
        env:
          H2A_TEST_CI_BULK_OUTPUT: ${{ github.workspace }}/tmp/bulk-export
      - uses: actions/upload-artifact@v4
        with:
          name: bulk-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
          path: tmp/bulk-export/proof.json
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    needs: [m17-qualification, bulk-qualification]
    # A skipped required check can satisfy branch protection. Run and FAIL when
    # either producer fails/cancels; dependency status is never itself a pass.
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    # Measured 2026-10-17: 15m06s on main, including ~13m npm test.
    # 2026-10-18 lane growth (mh-l6/registry suites): 21-23m completions,
    # four 25m14s timeout kills in eight executions. 35m budget and
    # slow-suite guard: docs/ci-job-budget.md.
    # Keep the DEC-061 process backstop; child deadlines are unchanged.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # DEC-061 + DEC-062: full cross-OS coverage. The `:`-in-paths
        # blocker that kept Windows out of the matrix initially was
        # fixed by safePathSegment() (DEC-062). The cross-CLI subprocess
        # tests of DEC-053 may still need a Windows-specific harness;
        # see cross-cli-cooperation.test.js for that skip decision.
        # Owner decision 2026-07-28 (track 01KYJ3Q3V5AW9YR0QMXSGW93RE): cross-platform
        # support is a SEPARATE workstream, and a parked platform must be INACTIVE, not
        # red-and-tolerated. An "accepted red" trains everyone to read failures as noise,
        # which is how a real failure gets waved through.
        #
        # Parked with the platform, so nothing is silently lost when it returns:
        #   windows — reporting-stdin (spawnSync stdin), restore-dead-session-recovery,
        #             and the cli-help-groups citation check
        #   macos/node-20 — the command-map + help-grouping suite; `--help` capture comes
        #             back truncated on that runner, so unrelated commands are simply
        #             absent from the captured output (a runner defect, not code)
        #
        # What this stops proving: that the code works on macOS or Windows at all.
        # `smoke-install` still exercises the PUBLISHED package on all three after release.
        os: [ubuntu-latest]
        # Owner decision 2026-10-12: minimum Node 22; qualify 22 and 24.
        node: ["22", "24"]
    steps:
      - name: Require both complete M17 qualifications
        env:
          M17_RESULT: ${{ needs.m17-qualification.result }}
        run: test "$M17_RESULT" = success
      - name: Require both complete bulk qualifications
        env:
          BULK_RESULT: ${{ needs.bulk-qualification.result }}
        run: test "$BULK_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install the mandatory configuration oracles
        run: npm install --global @openai/codex@0.145.0 @anthropic-ai/claude-code@2.1.296
      - name: Verify messaging backends and receive signatures
        run: node --test packages/h2a/test/send.test.js packages/h2a/test/cluster-mesh-messaging.test.js
      - uses: actions/download-artifact@v4
        with:
          name: m17-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
          path: tmp/m17-import
      - uses: actions/download-artifact@v4
        with:
          name: bulk-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
          path: tmp/bulk-import
      - run: npm test
        env:
          H2A_TEST_CI_M17_REPORT: ${{ github.workspace }}/tmp/m17-import/proof.json
          H2A_TEST_CI_BULK_REPORT: ${{ github.workspace }}/tmp/bulk-import/proof.json
      - name: Exercise the native multi-session terminal host
        run: >-
          npx --no-install vitest run
          packages/h2a-runtime/src/native-terminal/replay-buffer.test.ts
          packages/h2a-runtime/src/native-terminal/host.test.ts
          packages/h2a-runtime/src/native-terminal/server.test.ts
          packages/h2a-runtime/src/native-terminal/process.functional.test.ts
      # The suites that exercise the llm-mesh / llm-gateway dependency ranges live in
      # h2a-runtime, which `npm test` (packages/h2a + track, plus the
      # native-terminal leg above) does NOT cover. Without this step a range bump would
      # ride a CI that exercises nothing that changed — a false green. Gated here so the
      # dependency contract is proven in CI, not only on a maintainer's box.
      # Scope is deliberately the suites that IMPORT/exercise the dependency (or its
      # routing contract). enroll.test.ts is NOT here: it covers Claude-hook + session
      # REGISTRY enrolment (pid/endedAt liveness), imports neither package, and is
      # environment-fragile — gating it would be a false-red unrelated to these ranges.
      - name: Exercise the llm-mesh / llm-gateway consumer suites
        run: >-
          npx --no-install vitest run
          packages/h2a-runtime/src/llm-mesh-accounts.test.ts
          packages/h2a-runtime/src/claude-seat-input.test.ts
          packages/h2a-runtime/src/claude-code-cli-runner.test.ts
          packages/h2a-runtime/src/claude-code-cli-isolation.test.ts
          packages/h2a-runtime/src/claude-code-cli-lifecycle.test.ts
          packages/h2a-runtime/src/claude-code-cli-tools.test.ts
          packages/h2a-runtime/src/claude-code-cli-refresh-probe.test.ts
          packages/h2a-runtime/src/gateway-host/claude-code-seat-wiring.test.ts
          packages/h2a-runtime/src/gateway-host/daemon.test.ts
          packages/h2a-runtime/src/gateway-host/daemon-lifecycle.test.ts
          packages/h2a-runtime/src/gateway-host/config-file.test.ts
          packages/h2a-runtime/src/gateway-host/sessions.test.ts
          packages/h2a-runtime/src/llm-mesh-resolution.test.ts
          packages/h2a-runtime/src/routing-preferences.test.ts
          packages/h2a-runtime/src/gateway-host/native-tools.test.ts
          packages/h2a-runtime/src/gateway-host/host.test.ts
      # migration P2: le contrat public (surface MCP/CLI + anti-cycle core) ne doit pas dériver sans bump
      - run: bash scripts/check-public-contract.sh
        if: runner.os == 'Linux'

  # Stable, independently requireable trust root for `npm test`.
  #
  # Keep this as a dedicated job: GitHub branch protection can require jobs, not
  # individual steps. It deliberately bypasses package.json for the production
  # invocation, while the preceding direct test pins package wiring, this job's
  # graph, and the runner's exact production command map.
  npm-test-trust-root:
    name: npm-test-trust-root
    needs: [m17-qualification, bulk-qualification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Same complete entrypoint; 13m39s observed on main, 22m54s on the
    # 0.98.8 lane. See docs/ci-job-budget.md.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install the mandatory configuration oracles
        run: npm install --global @openai/codex@0.145.0 @anthropic-ai/claude-code@2.1.296
      - name: Verify npm test wiring independently
        run: node --test packages/h2a/test/run-test-gates.test.js
      - name: Require both complete M17 qualifications
        env:
          M17_RESULT: ${{ needs.m17-qualification.result }}
        run: test "$M17_RESULT" = success
      - name: Require both complete bulk qualifications
        env:
          BULK_RESULT: ${{ needs.bulk-qualification.result }}
        run: test "$BULK_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: m17-${{ github.run_id }}-${{ github.run_attempt }}-node22
          path: tmp/m17-import
      - uses: actions/download-artifact@v4
        with:
          name: bulk-${{ github.run_id }}-${{ github.run_attempt }}-node22
          path: tmp/bulk-import
      - name: Execute the production test entrypoint directly
        run: node scripts/run-test-gates.mjs
        env:
          H2A_TEST_CI_M17_REPORT: ${{ github.workspace }}/tmp/m17-import/proof.json
          H2A_TEST_CI_BULK_REPORT: ${{ github.workspace }}/tmp/bulk-import/proof.json
