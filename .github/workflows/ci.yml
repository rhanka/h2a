name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEC-061: cross-OS coverage. Three OSes catch (a) POSIX file-locks
        # PID-staleness vs Windows semantics (DEC-036), (b) macOS-specific
        # path/case quirks, (c) windows path separator surprises in tests
        # that compare raw strings rather than going through node:path.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
