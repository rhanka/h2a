name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # DEC-061: a leaked subprocess (e.g. an mcp-serve sidecar in a
    # cross-process test) once held the Windows runner open for 47 min.
    # 15 min is well above any honest test duration on any OS.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # DEC-061 + DEC-062: full cross-OS coverage. The `:`-in-paths
        # blocker that kept Windows out of the matrix initially was
        # fixed by safePathSegment() (DEC-062). The cross-CLI subprocess
        # tests of DEC-053 may still need a Windows-specific harness;
        # see cross-cli-cooperation.test.js for that skip decision.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # migration P2: le contrat public (surface MCP/CLI + anti-cycle core) ne doit pas dériver sans bump
      - run: bash scripts/check-public-contract.sh
        if: runner.os == 'Linux'

  # Stable, independently requireable trust root for `npm test`.
  #
  # Keep this as a dedicated job: GitHub branch protection can require jobs, not
  # individual steps. It deliberately bypasses package.json for the production
  # invocation, while the preceding direct test pins package wiring, this job's
  # graph, and the runner's exact production command map.
  npm-test-trust-root:
    name: npm-test-trust-root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify npm test wiring independently
        run: node --test packages/h2a/test/run-test-gates.test.js
      - name: Execute the production test entrypoint directly
        run: node scripts/run-test-gates.mjs
