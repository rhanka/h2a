name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # DEC-061: a leaked subprocess (e.g. an mcp-serve sidecar in a
    # cross-process test) once held the Windows runner open for 47 min.
    # 15 min is well above any honest test duration on any OS.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # DEC-061: ubuntu + macOS only. Windows is deferred — the V1
        # local-files store uses `:` inside negotiation/instance ids
        # which become directory names (`negotiations/nego:codex/...`),
        # and `:` is the drive-letter separator on Windows so any mkdir
        # of such a directory ENOENTs. Fixing it requires a sanitization
        # pass across the runtime + canonical layout decision; tracked
        # for a later DEC. The smoke workflow still runs on Windows
        # because the verbs it exercises do not create those dirs.
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
