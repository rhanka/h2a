name: smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-candidate.mjs dist-tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-candidate
          path: dist-tarballs/*.tgz
          if-no-files-found: error

  smoke-install:
    needs: build-candidate
    if: always() && (needs.build-candidate.result == 'success' || github.event_name != 'pull_request')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEC-061: smoke the npm-installed binary on the three target OSes.
        # `shell: bash` on the Windows runner uses Git Bash, which supports
        # the heredocs, `set -euo pipefail` and `mktemp -d` used below.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Two genuinely different tests, deliberately not conflated:
      #
      # - On a pull_request, install THIS PR's own build. This is the
      #   required-check path: it must be able to fail when the PR's CLI
      #   code is broken, or it isn't a gate.
      # - On push to main (and workflow_dispatch), install the PUBLISHED
      #   @sentropic/h2a@latest from npm. This checks the published
      #   artefact is actually installable/runnable — this project has
      #   shipped a release before where CI was green but the published
      #   tarball was an empty stub, so this half stays as a post-publish
      #   check, not as a PR gate (a PR's own diff has nothing to do with
      #   what npm currently serves as "latest").
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: smoke-candidate
          path: dist-tarballs

      - name: Locate this PR's verified lockstep packages
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$PWD/dist-tarballs"