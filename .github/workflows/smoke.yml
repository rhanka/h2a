name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install published @sentropic/h2a-cli@0.1.23 globally
        shell: bash
        run: |
          set -euo pipefail
          npm i -g @sentropic/h2a-cli@0.1.23
          which h2a
          h2a --help

      - name: Published CLI verbs exit 0
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/.h2a"
          registration='{"id":"conductor:smoke","instance":"conductor:smoke","roles":["CONDUCTOR"],"scopes":["scope:smoke"],"capabilities":["negotiate"],"endpoints":[],"publicKeys":[],"acceptedPolicies":[],"createdAt":"2026-05-18T00:00:00.000Z"}'
          h2a --help
          h2a hosts
          h2a mcp-tools
          h2a init --root "$root"
          h2a register --root "$root" --json "$registration"
          h2a discover --root "$root" --role CONDUCTOR --scope scope:smoke
          h2a host setup --host codex --root "$root" --print
          h2a host setup --host claude --root "$root" --print
