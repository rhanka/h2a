name: smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install published @sentropic/h2a-cli@0.1.1 globally
        shell: bash
        run: |
          set -euo pipefail
          npm i -g @sentropic/h2a-cli@0.1.1
          which h2a
          h2a --help

      - name: Published baseline CLI verbs exit 0
        shell: bash
        run: |
          set -euo pipefail
          h2a --help
          h2a hosts
          h2a mcp-tools
