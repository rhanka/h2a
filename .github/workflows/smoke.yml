name: smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # DEC-061: smoke the npm-installed binary on the three target OSes.
        # `shell: bash` on the Windows runner uses Git Bash, which supports
        # the heredocs, `set -euo pipefail` and `mktemp -d` used below.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Two genuinely different tests, deliberately not conflated:
      #
      # - On a pull_request, install THIS PR's own build. This is the
      #   required-check path: it must be able to fail when the PR's CLI
      #   code is broken, or it isn't a gate.
      # - On push to main (and workflow_dispatch), install the PUBLISHED
      #   @sentropic/h2a@latest from npm. This checks the published
      #   artefact is actually installable/runnable — this project has
      #   shipped a release before where CI was green but the published
      #   tarball was an empty stub, so this half stays as a post-publish
      #   check, not as a PR gate (a PR's own diff has nothing to do with
      #   what npm currently serves as "latest").
      - name: Build and pack this PR's lockstep packages
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          # packages/h2a's `prepack` (scripts/check-focus-app.mjs) asserts
          # the vendored packages/h2a/focus-app bundle is fresh against
          # apps/focus/src. That is a real, separate, pre-existing
          # invariant about publish-readiness of the bundled web app, not
          # about CLI correctness, which is all this job gates. Skip that
          # lifecycle script here rather than let its unrelated staleness
          # fail every PR's smoke check for a reason that has nothing to
          # do with the PR's own code; the push/publish path below still
          # exercises a real `npm publish`, which runs prepack for real.
          chmod +x packages/h2a/dist/bin.js
          pack_dir="$(mktemp -d)"
          npm pack --workspace @sentropic/h2a --ignore-scripts --pack-destination "$pack_dir"
          npm pack --workspace @sentropic/track --pack-destination "$pack_dir"
          npm pack --workspace @sentropic/h2a-cli --pack-destination "$pack_dir"
          npm pack --workspace @sentropic/h2a-runtime --pack-destination "$pack_dir"
          echo "PACKED_H2A_TARBALL=$(ls "$pack_dir"/sentropic-h2a-[0-9]*.tgz)" >> "$GITHUB_ENV"
          echo "PACKED_TRACK_TARBALL=$(ls "$pack_dir"/sentropic-track-*.tgz)" >> "$GITHUB_ENV"
          echo "PACKED_H2A_CLI_TARBALL=$(ls "$pack_dir"/sentropic-h2a-cli-*.tgz)" >> "$GITHUB_ENV"
          echo "PACKED_H2A_RUNTIME_TARBALL=$(ls "$pack_dir"/sentropic-h2a-runtime-*.tgz)" >> "$GITHUB_ENV"

      - name: Install this PR's own build globally
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Install the lockstep tarballs in one npm transaction so h2a's
          # unreleased track dependency and runtime peer resolve from this PR,
          # rather than requiring the release version from the registry.
          npm i -g "$PACKED_H2A_TARBALL" "$PACKED_TRACK_TARBALL" "$PACKED_H2A_CLI_TARBALL" "$PACKED_H2A_RUNTIME_TARBALL"
          which h2a
          h2a --help

      - name: Install published @sentropic/h2a globally
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          npm i -g @sentropic/h2a@latest
          npm ls -g @sentropic/h2a --depth=0
          which h2a
          h2a --help

      - name: CLI verbs exit 0
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)/.h2a"
          registration='{"id":"conductor:smoke","instance":"conductor:smoke","roles":["CONDUCTOR"],"scopes":["scope:smoke"],"capabilities":["negotiate"],"endpoints":[],"publicKeys":[],"acceptedPolicies":[],"createdAt":"2026-05-18T00:00:00.000Z"}'
          h2a --help
          h2a hosts
          h2a mcp-tools
          h2a init --root "$root"
          h2a register --root "$root" --json "$registration"
          h2a discover --root "$root" --role CONDUCTOR --scope scope:smoke
          h2a host setup --host codex --root "$root" --print
          h2a host setup --host claude --root "$root" --print
          # doctor is dry-run by default. Parse the installed artefact's report
          # so a success exit with non-JSON stdout cannot satisfy this gate.
          h2a doctor --root "$root" --format json | node -e '
            let stdout = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { stdout += chunk; });
            process.stdin.on("end", () => {
              let report;
              try {
                report = JSON.parse(stdout);
              } catch {
                process.exitCode = 1;
                return;
              }
              if (!Object.prototype.hasOwnProperty.call(report, "ok")) {
                process.exitCode = 1;
              }
            });
          '
